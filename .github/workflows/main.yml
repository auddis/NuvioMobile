name: Build NuvioMobile iOS

on:
  schedule:
    - cron: '0 2 * * *'  # Runs automatically every day at 2:00 AM UTC
  workflow_dispatch:      # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: macos-latest

    steps:
      - name: 1. Check Upstream Latest Release / Commit
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch latest tag from upstream NuvioMobile repo using gh CLI
          UPSTREAM_TAG=$(gh api repos/NuvioMedia/NuvioMobile/releases/latest --jq '.tag_name' 2>/dev/null || true)

          # Fallback to cmp-rewrite branch short commit SHA if no release tags exist
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" == "null" ]; then
            UPSTREAM_TAG=$(gh api repos/NuvioMedia/NuvioMobile/commits/cmp-rewrite --jq '.sha[0:7]' 2>/dev/null || true)
          fi

          # Hard fallback to branch name if API is unavailable
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" == "null" ]; then
            UPSTREAM_TAG="cmp-rewrite"
          fi

          echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "Upstream version found: $UPSTREAM_TAG"

      - name: 2. Checkout NuvioMobile Code
        uses: actions/checkout@v4
        with:
          repository: 'NuvioMedia/NuvioMobile'
          ref: ${{ steps.upstream.outputs.tag }}

      - name: 3. Initialize Required Submodules
        run: |
          git submodule sync || true
          git submodule update --init --recursive MPVKit || true

      - name: 4. Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 5. Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 6. Configure local.properties
        run: |
          if [ -n "${RELEASE_PROPERTIES_BASE64}" ]; then
            echo "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            touch local.properties
          fi
        env:
          RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

      - name: 7. Compile iOS Release Build via Xcode
        run: |
          # Clean build directory
          rm -rf iosApp/build Payload NuvioMobile-*.ipa

          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 8. Package Unsigned .ipa File
        run: |
          mkdir -p Payload
          APP_PATH=$(find iosApp/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find compiled .app bundle!"
            exit 1
          fi

          echo "Packaging $APP_PATH into IPA..."
          cp -R "$APP_PATH" Payload/
          zip -r "NuvioMobile-${{ steps.upstream.outputs.tag }}.ipa" Payload

          echo "IPA Created: NuvioMobile-${{ steps.upstream.outputs.tag }}.ipa"

      - name: 9. Publish Built .ipa to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: NuvioMobile iOS ${{ steps.upstream.outputs.tag }}
          body: |
            Automated iOS build of `NuvioMedia/NuvioMobile` version `${{ steps.upstream.outputs.tag }}`.
          files: NuvioMobile-*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
